services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: darukaa
      POSTGRES_PASSWORD: darukaa
      POSTGRES_DB: darukaa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darukaa -d darukaa"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://darukaa:darukaa@postgres:5432/darukaa
      EMBEDDING_BACKEND: hashing
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      CORS_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
